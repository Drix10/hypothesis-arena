# The build fingerprint that scripts/check-manifest.sh verifies the code against.
# A value changes only with a doc edit and a fresh paper window.

plan_docs: [README, vision, strategies, engine, data, math, risk, kernel, execution, stages, validation, roadmap]
strategies: [link_momentum, filing_change, event_ripple, etf_trend]

candidate_schema: candidate
feature_schema: "1"
cost_model: costs
exit_rules: [exit_link, exit_event, exit_trend]

stages: [PAPER, TINY, SCALED, FULL]
model_spend_caps_usd_30d:
  paper: 150
  tiny: 150
  scaled: 400
  full: 1000
spend_ratio_cap: 0.20  # scaled and full stages only

# Research and shadow testing run under the US set; the kernel enforces the
# India set until kernel short selling is built.
target_constraint_set: us
constraint_sets:
  india:
    account_type: cash
    direction: long_only
    leverage: 1
    instruments: [us_common_stock, us_etf]
    excluded: [margin, short_sale, options, futures, fx_spot_or_cfd, leveraged_or_inverse_etf, crypto]
    settlement: T+1
    extended_hours: false
    tiny_stage_symbol_rule: one_liquid_us_etf
  us:
    account_type: margin_reg_t
    direction: long_short
    gross_max: 1.5
    instruments: [us_common_stock, us_etf]
    short_rule: easy_to_borrow_only
    excluded: [options, futures, fx_spot_or_cfd, leveraged_or_inverse_etf, crypto]
    extended_hours: false
    book_equity_usd: 25000

universe:
  execution_max: 5
  research_candidates: 50

venues:
  stocks_paper: Alpaca-paper
  stocks_live: Alpaca  # after the jurisdiction check in plan/stages.md

research_models: TBD_AT_BUILD  # per-role pins with knowledge cutoffs (plan/engine.md)

framework_pins:
  langgraph: 1.1.6
  smolagents: 1.26.0
  langfuse_client: 4.15.4
