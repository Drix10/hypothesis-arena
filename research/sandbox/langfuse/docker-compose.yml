# Langfuse self-hosted stack for per-node token and cost attribution (plan/engine.md).
# Secrets come from the environment and are never committed. Before
# `docker compose up`, export LANGFUSE_POSTGRES_PASSWORD,
# LANGFUSE_CLICKHOUSE_PASSWORD, LANGFUSE_NEXTAUTH_SECRET, LANGFUSE_SALT and
# LANGFUSE_ENCRYPTION_KEY (64 hex chars); compose refuses to start without them.
name: mirohedge-langfuse
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?export LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: "no"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: "no"
    environment:
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?export LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  langfuse:
    image: langfuse/langfuse:2
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/langfuse
      DIRECT_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@postgres:5432/langfuse
      REDIS_CONNECTION_STRING: redis://redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?export LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT:?export LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?export LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_URL: http://127.0.0.1:3000
      TELEMETRY_ENABLED: "false"
volumes:
  pgdata:
  chdata:
