# Repository-level execution evidence (Phase-D audit finding: claimed
# green counts were local-only). Four jobs on every push/PR:
#  1. stdlib — collector suites only (mocked IO, no network),
#     no third-party deps.
#  2. evidence — plane isolation + sources suites, stdlib only, in
#     their own job so collector failure cannot mask them (Round-9
#     audit gap: isolation used to be skipped behind the frozen
#     collector loop, and sources never ran in CI at all).
#  3. plane — full research-plane battery in the pinned venv, including
#     the final-hardening P0 suite (concurrency, crash recovery,
#     process boundary, publisher/manifest/reader/digest).
#  4. kernel — deterministic C++ gates (normal mode; MinGW-only
#     hardened flags stay local to the Windows build host).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collector suites (mocked IO, no network)
        run: |
          for t in test_ctx test_jev test_pipeline test_config test_collect; do
            python3 collector/tests/$t.py
          done
          # CI-only fixture (soak_check alone): it requires effective
          # config to carry the EDGAR contact. Synthetic non-secret
          # value via the documented exported-env-wins contract
          # (config.py); test_config asserts a clean env, so the
          # override is scoped to this one command. No secret, and the
          # checkout has no tracked .env.
          MIRO_CONTACT=ci-test@example.invalid \
            python3 collector/tests/test_soak_check.py

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: plane isolation (stdlib only)
        run: python3 research-plane/tests/test_isolation.py
      - name: plane sources (stdlib only)
        run: python3 research-plane/tests/test_sources.py
      - name: plane EDGAR adapter (stdlib only)
        run: python3 research-plane/tests/test_edgar.py
      - name: plane FRED adapter (stdlib only)
        run: python3 research-plane/tests/test_fred.py

  plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pinned plane deps
        run: python3 -m pip install -r research-plane/requirements.txt
      - name: plane battery (no external network; .invalid hosts only)
        run: |
          python3 research-plane/tests/test_plane.py
          python3 research-plane/tests/test_hardening.py
          python3 research-plane/tests/test_emit.py

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: deterministic kernel gates
        run: bash kernel/build.sh
      - name: freeze pins
        run: bash scripts/freeze-check.sh
