# CI runs on every push, PR and manual dispatch:
#  1. stdlib: collector suites only (mocked IO, no network, no third-party deps).
#  2. evidence: engine isolation and sources suites, stdlib only, separate from
#     the collector job so neither masks the other.
#  3. plane: full engine test battery in the pinned venv (concurrency, crash
#     recovery, process boundary, publisher/manifest/reader/digest).
#  4. kernel: deterministic C++ gates in normal mode.
#  5. kernel-sanitizer: the same C++ gates rebuilt with ASan+UBSan; the
#     --wrap,malloc allocation proofs stay in the normal-mode gate.
#  6. agent-flow: context files against the tree (doctor) and new risk
#     surfaces against .risk-baseline.json (audit-risk), from the committed
#     .agent-flow-runtime/ (no npm).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collector suites (mocked IO, no network)
        run: |
          for t in test_ctx test_jev test_pipeline test_config test_collect test_env_loading; do
            python3 collector/tests/$t.py
          done
          # CI-only fixture (soak_check alone): it requires effective
          # config to carry the EDGAR contact. Synthetic non-secret
          # value via the documented exported-env-wins contract
          # (config.py); test_config asserts a clean env, so the
          # override is scoped to this one command. No secret, and the
          # checkout has no tracked .env.
          MIRO_CONTACT=ci-test@example.invalid \
            python3 collector/tests/test_soak_check.py

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: engine isolation (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_isolation.py
      - name: engine sources (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_sources.py
      - name: engine EDGAR adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_edgar.py
      - name: engine FRED adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_fred.py
      - name: engine Treasury adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_treasury.py
      - name: engine BLS adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_bls.py
      - name: engine BEA adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_bea.py
      - name: engine source-seam integration (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_source_seam.py
      - name: strategy trial ledger (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_ledger.py
      - name: strategy statistics standard (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_stats.py
      - name: strategy cost_v2 + settlement (stdlib only)
        run: |
          PYTHONWARNINGS=error python3 research/tests/test_costs_v2.py
          PYTHONWARNINGS=error python3 research/tests/test_costs_v3.py
          PYTHONWARNINGS=error python3 research/tests/test_settlement.py
          PYTHONWARNINGS=error python3 research/tests/test_prereg.py
          PYTHONWARNINGS=error python3 research/tests/test_portfolio.py
          PYTHONWARNINGS=error python3 research/tests/test_gates.py
          PYTHONWARNINGS=error python3 research/tests/test_sip_fetch.py
          PYTHONWARNINGS=error python3 research/tests/test_tier_a.py
          PYTHONWARNINGS=error python3 research/tests/test_form4.py
          PYTHONWARNINGS=error python3 research/tests/test_candidate_wire.py
          PYTHONWARNINGS=error python3 research/tests/test_core_passive.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_ledgers.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_eval.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_register.py
          PYTHONWARNINGS=error python3 research/tests/test_earnings_surprise.py
          PYTHONWARNINGS=error python3 research/tests/test_alert_relay.py
          PYTHONWARNINGS=error python3 research/tests/test_deploy_check.py
      - name: strategy baseline (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_baseline.py
      - name: strategy JEV filter interop (stdlib only)
        run: python3 research/tests/test_jev_filter.py
      - name: strategy candidate contract (pinned pytest)
        run: |
          python3 -m pip install -r research/strategy/requirements.txt
          python3 -m pytest -q research/tests/test_candidate.py

  plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pinned engine deps
        run: python3 -m pip install -r research/requirements.txt
      - name: engine battery (no external network; .invalid hosts only)
        run: |
          PYTHONWARNINGS=error python3 research/tests/test_engine.py
          PYTHONWARNINGS=error python3 research/tests/test_hardening.py
          PYTHONWARNINGS=error python3 research/tests/test_emit.py
          PYTHONWARNINGS=error python3 research/tests/test_seam_graph.py
          PYTHONWARNINGS=error python3 research/tests/test_event_direction.py

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ libcurl4-openssl-dev
      - name: deterministic kernel gates (incl. live-transport build)
        run: WITH_CURL=1 bash kernel/build.sh
      - name: C++ JEV filter vectors
        run: |
          g++ -std=c++17 -Wall -Wextra -O2 -o /tmp/test_jev_filter kernel/tests/test_jev_filter.cpp
          /tmp/test_jev_filter kernel/jev_vectors
      - name: freeze pins
        run: bash scripts/freeze-check.sh

  kernel-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: deterministic kernel gates under ASan+UBSan
        run: bash kernel/build.sh sanitize

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, SHA-256 verified, full history)
        run: |
          V=8.21.2
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks detect --no-banner --redact -c .gitleaks.toml

  agent-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: context files match the tree (stale timestamps warn, not fail)
        run: node .agent-flow-runtime/bin/agent-flow.js doctor --allow-stale
      - name: no new risk surfaces since the accepted baseline
        run: node .agent-flow-runtime/bin/agent-flow.js audit-risk --fail-on-new
