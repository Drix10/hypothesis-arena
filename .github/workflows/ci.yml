# CI runs on every pull request, on pushes to main, nightly on main and on
# manual dispatch. Branch pushes without a PR do not run it (agents open a PR
# for every change); a newer push to a PR cancels its superseded run.
#  1. stdlib: collector suites only (mocked IO, no network, no third-party deps).
#  2. evidence: engine isolation, source and harness suites, stdlib only,
#     separate from the collector job so neither masks the other.
#  3. plane: the full engine test battery in the pinned venv (concurrency,
#     crash recovery, process boundary, publisher, manifest, reader, digest).
#  4. kernel: deterministic C++ gates in normal mode, plus the manifest check.
#  5. kernel-sanitizer: the same C++ gates rebuilt with ASan+UBSan; the
#     --wrap,malloc allocation proofs stay in the normal-mode gate.
#  6. secrets: gitleaks over the full history.
#  7. agent-flow: context files against the tree (doctor) and new risk
#     surfaces against .risk-baseline.json (audit-risk), from the committed
#     .agent-flow-runtime/ (no npm).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly full run on main (03:17 UTC)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collector suites (mocked IO, no network)
        run: |
          for t in test_ctx test_pipeline test_config test_collect test_env_loading; do
            python3 collector/tests/$t.py
          done
          # test_soak_check alone needs the EDGAR contact in effective config.
          # A synthetic non-secret value goes in through the exported-env-wins
          # contract (config.py); test_config asserts a clean env, so the
          # override is scoped to this one command. The checkout has no
          # tracked .env.
          MIRO_CONTACT=ci-test@example.invalid \
            python3 collector/tests/test_soak_check.py

  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: engine isolation (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_isolation.py
      - name: engine sources (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_sources.py
      - name: engine EDGAR adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_edgar.py
      - name: engine FRED adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_fred.py
      - name: engine Treasury adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_treasury.py
      - name: engine BLS adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_bls.py
      - name: engine BEA adapter (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_bea.py
      - name: engine source-seam integration (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_source_seam.py
      - name: strategy trial ledger (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_ledger.py
      - name: strategy statistics standard (stdlib only)
        run: PYTHONWARNINGS=error python3 research/tests/test_stats.py
      - name: strategy harness, costs and ops tools (stdlib only)
        run: |
          PYTHONWARNINGS=error python3 research/tests/test_costs.py
          PYTHONWARNINGS=error python3 research/tests/test_settlement.py
          PYTHONWARNINGS=error python3 research/tests/test_prereg.py
          PYTHONWARNINGS=error python3 research/tests/test_portfolio.py
          PYTHONWARNINGS=error python3 research/tests/test_gates.py
          PYTHONWARNINGS=error python3 research/tests/test_sip_fetch.py
          PYTHONWARNINGS=error python3 research/tests/test_tier_a.py
          PYTHONWARNINGS=error python3 research/tests/test_form4.py
          PYTHONWARNINGS=error python3 research/tests/test_issuer_symbols.py
          PYTHONWARNINGS=error python3 research/tests/test_candidate_wire.py
          PYTHONWARNINGS=error python3 research/tests/test_passive_core.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_ledgers.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_eval.py
          PYTHONWARNINGS=error python3 research/tests/test_forward_register.py
          PYTHONWARNINGS=error python3 research/tests/test_alert_relay.py
          PYTHONWARNINGS=error python3 research/tests/test_alpaca_short_probe.py
          PYTHONWARNINGS=error python3 research/tests/test_deploy_check.py
          PYTHONWARNINGS=error python3 research/tests/test_backtest.py
          PYTHONWARNINGS=error python3 research/tests/test_bar_loader.py
          PYTHONWARNINGS=error python3 research/tests/test_build_filing_scores.py
          PYTHONWARNINGS=error python3 research/tests/test_build_form4_events.py
          PYTHONWARNINGS=error python3 research/tests/test_build_reference.py
          PYTHONWARNINGS=error python3 research/tests/test_build_universe.py
          PYTHONWARNINGS=error python3 research/tests/test_build_vetoes.py
          PYTHONWARNINGS=error python3 research/tests/test_build_link_store.py
          PYTHONWARNINGS=error python3 research/tests/test_collect_end_events.py
          PYTHONWARNINGS=error python3 research/tests/test_collect_ticker_observations.py
          PYTHONWARNINGS=error python3 research/tests/test_fetch_french_factors.py
          PYTHONWARNINGS=error python3 research/tests/test_fetch_universe_bars.py
          PYTHONWARNINGS=error python3 research/tests/test_coverage_probe.py
          PYTHONWARNINGS=error python3 research/tests/test_customer_coverage_probe.py
          PYTHONWARNINGS=error python3 research/tests/test_real_filing_probe.py
          PYTHONWARNINGS=error python3 research/tests/test_edgar_filings.py
          PYTHONWARNINGS=error python3 research/tests/test_emit_connected_drift.py
          PYTHONWARNINGS=error python3 research/tests/test_end_events.py
          PYTHONWARNINGS=error python3 research/tests/test_etf_trend.py
          PYTHONWARNINGS=error python3 research/tests/test_etf_trend_chain.py
          PYTHONWARNINGS=error python3 research/tests/test_filing_sections.py
          PYTHONWARNINGS=error python3 research/tests/test_form13f.py
          PYTHONWARNINGS=error python3 research/tests/test_french_factors.py
          PYTHONWARNINGS=error python3 research/tests/test_gdelt_gkg.py
          PYTHONWARNINGS=error python3 research/tests/test_last_trade.py
          PYTHONWARNINGS=error python3 research/tests/test_link_store.py
          PYTHONWARNINGS=error python3 research/tests/test_ownership_edges.py
          PYTHONWARNINGS=error python3 research/tests/test_placebo.py
          PYTHONWARNINGS=error python3 research/tests/test_shares_outstanding.py
          PYTHONWARNINGS=error python3 research/tests/test_text_peers.py
          PYTHONWARNINGS=error python3 research/tests/test_ticker_map.py
          PYTHONWARNINGS=error python3 research/tests/test_ticker_observations.py
          PYTHONWARNINGS=error python3 research/tests/test_tranches.py
          PYTHONWARNINGS=error python3 research/tests/test_composite.py
          PYTHONWARNINGS=error python3 research/tests/test_connected_drift_chain.py
          PYTHONWARNINGS=error python3 research/tests/test_connected_drift_prereg.py
          PYTHONWARNINGS=error python3 research/tests/test_run_connected_drift.py
          PYTHONWARNINGS=error python3 research/tests/test_customer_edges.py
          PYTHONWARNINGS=error python3 research/tests/test_decay_monitor.py
          PYTHONWARNINGS=error python3 research/tests/test_text_change.py
          PYTHONWARNINGS=error python3 research/tests/test_universe.py

  plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pinned engine deps
        run: python3 -m pip install -r research/requirements.txt
      - name: engine battery (no external network; .invalid hosts only)
        run: |
          PYTHONWARNINGS=error python3 research/tests/test_engine.py
          PYTHONWARNINGS=error python3 research/tests/test_hardening.py
          PYTHONWARNINGS=error python3 research/tests/test_emit.py
          PYTHONWARNINGS=error python3 research/tests/test_seam_graph.py

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ libcurl4-openssl-dev
      - name: deterministic kernel gates (incl. live-transport build)
        run: WITH_CURL=1 bash kernel/build.sh
      - name: manifest check
        run: bash scripts/check-manifest.sh

  kernel-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: deterministic kernel gates under ASan+UBSan
        run: bash kernel/build.sh sanitize

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (pinned release, SHA-256 verified, full history)
        run: |
          V=8.21.2
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          ./gitleaks detect --no-banner --redact -c .gitleaks.toml

  agent-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: context files match the tree (stale timestamps warn, not fail)
        run: node .agent-flow-runtime/bin/agent-flow.js doctor --allow-stale
      - name: no new risk surfaces since the accepted baseline
        run: node .agent-flow-runtime/bin/agent-flow.js audit-risk --fail-on-new
