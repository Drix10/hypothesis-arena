# Repository-level execution evidence (Phase-D audit finding: claimed
# green counts were local-only). Three jobs on every push/PR:
#  1. stdlib — collector + plane isolation tests, no third-party deps.
#  2. plane — full research-plane battery in the pinned venv.
#  3. kernel — deterministic C++ gates (normal mode; MinGW-only
#     hardened flags stay local to the Windows build host).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stdlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: collector suites (mocked IO, no network)
        run: |
          for t in test_ctx test_jev test_pipeline test_config test_collect test_soak_check; do
            python3 collector/$t.py
          done
      - name: plane isolation (stdlib only)
        run: python3 research-plane/tests/test_isolation.py

  plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install pinned plane deps
        run: python3 -m pip install -r research-plane/requirements.txt
      - name: plane battery (no external network; .invalid hosts only)
        run: |
          python3 research-plane/tests/test_plane.py
          python3 research-plane/tests/test_emit.py

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: deterministic kernel gates
        run: bash kernel/build.sh
      - name: freeze pins
        run: bash scripts/freeze-check.sh
