# Secret-scan config. Default ruleset plus a narrow path allowlist. Nothing here
# may ever cover a real credential; each entry is a reviewed false positive.
[extend]
useDefault = true

[allowlist]
description = "committed test vectors (SHA-256 digests) and the local evidence-only sandbox"
paths = [
  '''^kernel/(fixtures|vectors)/''',            # digests and test vectors
  '''^kernel/(p33|v4)/''',                      # earlier vector directories, present only in history: every hit is a 64-hex SHA-256 test digest, none is a credential
  '''^handoff/cleanup\.patch$''',            # removed patch file, present only in history: 64-hex test digests tripping generic-api-key
  '''^kernel/jev_vectors/''',                  # removed model-filter vectors, present only in history: 64-hex test digests tripping generic-api-key
  '''^research(-plane)?/sandbox/langfuse/docker-compose\.yml$''', # throwaway local Langfuse (also its earlier path in history), never networked
  '''^\.claude/agent-flow-install\.json$''',  # SHA-256 digests of installed agent-flow files
]
